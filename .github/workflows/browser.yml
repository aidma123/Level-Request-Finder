name: Build ZenLite browser

on:
  push:
    paths:
      - "browser/**"
      - ".github/workflows/browser.yml"
  workflow_dispatch:

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: browser/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: browser/desktop
      - run: cargo test --release
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ZenLite-windows-x64
          path: browser/desktop/target/release/zenlite.exe
